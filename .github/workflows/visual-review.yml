name: Visual Review

on:
  pull_request:
    branches: [main]
    paths:
      - 'public/game/fish.js'
      - 'public/game/fish-evolution.mjs'
      - 'public/game/effects.js'
      - 'public/game/environment.js'
      - 'public/game/biomes.js'
      - 'public/game/world-actors.js'
      - 'public/app.js'
      - 'public/styles.css'
      - 'public/index.html'
      - 'public/ui/lobby.js'
      - 'public/game/network.js'
      - 'public/client-social.mjs'
      - 'review/abyssal-assets.html'
      - '.github/workflows/visual-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    name: abyssal-assets-screenshot
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Render real asset review scene
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/abyss-review-http.log 2>&1 &
          server_pid=$!
          python3 -m http.server 4174 --bind 127.0.0.1 --directory public > /tmp/abyss-lobby-http.log 2>&1 &
          lobby_server_pid=$!
          trap 'kill "$server_pid" "$lobby_server_pid" 2>/dev/null || true' EXIT
          ready=0
          lobby_ready=0
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/review/abyssal-assets.html?ci=1 >/dev/null; then
              ready=1
            fi
            if curl --fail --silent http://127.0.0.1:4174/?visual-review=1 >/dev/null; then
              lobby_ready=1
            fi
            if [ "$ready" -eq 1 ] && [ "$lobby_ready" -eq 1 ]; then
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/abyss-review-http.log || true
            echo '::error::Visual review HTTP server did not become ready.'
            exit 1
          fi
          if [ "$lobby_ready" -ne 1 ]; then
            cat /tmp/abyss-lobby-http.log || true
            echo '::error::Social lobby HTTP server did not become ready.'
            exit 1
          fi
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo '::error::No Chromium-compatible browser is available on the runner.'
            exit 1
          fi
          set +e
          timeout 80s "$browser" \
            --headless=new \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/abyss-chrome \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --window-size=1600,1000 \
            --virtual-time-budget=6000 \
            --screenshot="$PWD/artifacts/abyssal-assets.png" \
            http://127.0.0.1:4173/review/abyssal-assets.html?ci=1 \
            > /tmp/abyss-review-chrome.log 2>&1
          browser_status=$?
          set -e
          if [ ! -s artifacts/abyssal-assets.png ]; then
            cat /tmp/abyss-review-chrome.log || true
            echo "::error::Browser failed to produce visual-review PNG (exit ${browser_status})."
            exit 1
          fi
          if [ "$browser_status" -ne 0 ]; then
            echo "Browser exited ${browser_status} after producing the PNG; accepting the bounded artifact."
          fi

          set +e
          timeout 80s "$browser" \
            --headless=new \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-dev-shm-usage \
            --user-data-dir=/tmp/abyss-lobby-chrome \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --hide-scrollbars \
            --run-all-compositor-stages-before-draw \
            --window-size=1600,1000 \
            --virtual-time-budget=7000 \
            --screenshot="$PWD/artifacts/social-lobby.png" \
            http://127.0.0.1:4174/?visual-review=1 \
            > /tmp/abyss-lobby-chrome.log 2>&1
          lobby_status=$?
          set -e
          if [ ! -s artifacts/social-lobby.png ]; then
            cat /tmp/abyss-lobby-chrome.log || true
            echo "::error::Browser failed to produce social lobby PNG (exit ${lobby_status})."
            exit 1
          fi
          if [ "$lobby_status" -ne 0 ]; then
            echo "Lobby browser exited ${lobby_status} after producing the PNG; accepting the bounded artifact."
          fi

      - name: Upload visual review
        uses: actions/upload-artifact@v7
        with:
          name: abyssal-assets-visual-review
          path: artifacts/*.png
          if-no-files-found: error
          retention-days: 7
