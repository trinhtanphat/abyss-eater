name: Provision Carrier 3 D1

on:
  push:
    branches: [feat/v1-carrier3-persistence-progression]
    paths:
      - '.github/workflows/provision-carrier3-d1.yml'

permissions:
  contents: read

jobs:
  provision-free-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
      D1_NAME: abyss-eater-progression
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_6666 || secrets.CLOUDFLARE_API_TOKEN }}
      CF_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require Cloudflare token
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN_6666 (or fallback CLOUDFLARE_API_TOKEN)."
            exit 1
          fi

      - name: Fail closed unless Workers account is free
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/subscriptions" \
            > /tmp/subscriptions.json
          node <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync('/tmp/subscriptions.json', 'utf8'));
          if (response.success !== true || !Array.isArray(response.result)) {
            console.error('::error::Could not prove Cloudflare subscription state; refusing D1 mutation.');
            process.exit(1);
          }
          const active = response.result.filter((item) => !['Cancelled', 'Expired', 'Failed'].includes(item?.state));
          const workerPlans = active
            .map((item) => String(item?.rate_plan?.id || ''))
            .filter((id) => /WORKERS/i.test(id));
          const paidWorkerPlans = workerPlans.filter((id) => !/FREE/i.test(id));
          if (paidWorkerPlans.length) {
            console.error(`::error::Paid Workers subscription detected (${paidWorkerPlans.join(', ')}); user forbids paid-service mutations.`);
            process.exit(1);
          }
          console.log(workerPlans.length ? `Confirmed free Workers plan: ${workerPlans.join(', ')}` : 'No paid Workers subscription found; account remains on default Workers Free plan.');
          NODE

      - name: Create or reuse free-tier D1 database
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.1 d1 list --json > /tmp/d1-list.json
          existing_id="$(node -e "const a=require('/tmp/d1-list.json'); const d=a.find(x=>x.name===process.env.D1_NAME); if(d) process.stdout.write(d.uuid||d.id||'')")"
          if [ -z "$existing_id" ]; then
            npx --yes wrangler@4.129.1 d1 create "$D1_NAME" --location apac
            npx --yes wrangler@4.129.1 d1 list --json > /tmp/d1-list.json
            existing_id="$(node -e "const a=require('/tmp/d1-list.json'); const d=a.find(x=>x.name===process.env.D1_NAME); if(d) process.stdout.write(d.uuid||d.id||'')")"
          fi
          if ! [[ "$existing_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "::error::D1 database ID could not be resolved after provisioning."
            exit 1
          fi
          echo "D1_DATABASE_ID=$existing_id" >> "$GITHUB_ENV"
          echo "Carrier 3 D1 database: $D1_NAME ($existing_id)" >> "$GITHUB_STEP_SUMMARY"
          echo "D1_DATABASE_ID=$existing_id"
