name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-production.yml'

concurrency:
  group: abyss-eater-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CF_TELEMETRY_DISABLED: '1'
      CF_ACCOUNT_ID: 6c5207813df3d5b83b9508125e0e9e12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify release candidate
        run: npm run check

      - name: Fail closed unless Workers account is free
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_6666 || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN_6666 (or fallback CLOUDFLARE_API_TOKEN)."
            exit 1
          fi
          curl --fail --show-error --silent \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/subscriptions" \
            > /tmp/subscriptions.json
          node <<'NODE'
          const fs = require('node:fs');
          const response = JSON.parse(fs.readFileSync('/tmp/subscriptions.json', 'utf8'));
          if (response.success !== true || !Array.isArray(response.result)) {
            console.error('::error::Could not prove Cloudflare subscription state; refusing production mutation.');
            process.exit(1);
          }
          const active = response.result.filter((item) => !['Cancelled', 'Expired', 'Failed'].includes(item?.state));
          const workerPlans = active
            .map((item) => String(item?.rate_plan?.id || ''))
            .filter((id) => /WORKERS/i.test(id));
          const paidWorkerPlans = workerPlans.filter((id) => !/FREE/i.test(id));
          if (paidWorkerPlans.length) {
            console.error(`::error::Paid Workers subscription detected (${paidWorkerPlans.join(', ')}); production mutation refused.`);
            process.exit(1);
          }
          console.log(workerPlans.length ? `Confirmed free Workers plan: ${workerPlans.join(', ')}` : 'No paid Workers subscription found; default Workers Free plan accepted.');
          NODE

      - name: Render persistence production config
        env:
          ABYSS_EATER_D1_DATABASE_ID: ${{ secrets.ABYSS_EATER_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${ABYSS_EATER_D1_DATABASE_ID:-}" ]; then
            echo "::error::Missing ABYSS_EATER_D1_DATABASE_ID for an existing free-tier D1 database."
            exit 1
          fi
          node scripts/render-production-wrangler.mjs

      - name: Verify existing session signing secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_6666 || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.1 secret list --config dist/wrangler.production.jsonc | tee /tmp/worker-secrets.txt
          grep -Fq 'SESSION_SIGNING_KEY' /tmp/worker-secrets.txt || { echo "::error::SESSION_SIGNING_KEY must already exist on the Worker."; exit 1; }

      - name: Apply Carrier 3 D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_6666 || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.1 d1 migrations apply PROFILE_DB --remote --config dist/wrangler.production.jsonc

      - name: Deploy authoritative game Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_6666 || secrets.CLOUDFLARE_API_TOKEN }}
          ABYSS_EATER_D1_DATABASE_ID: ${{ secrets.ABYSS_EATER_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          npm run deploy:game

      - name: Deploy branded gateway Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_2403 || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing CLOUDFLARE_API_TOKEN_2403 (or fallback CLOUDFLARE_API_TOKEN)."
            exit 1
          fi
          npm run deploy:gateway

      - name: Verify production health
        run: |
          set -euo pipefail
          for url in \
            https://abyss-eater.hikvision.workers.dev/health \
            https://abyss-eater.qs3d.site/health
          do
            body="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 20 "$url")"
            echo "$url => $body"
            grep -Fq '"ok":true' <<<"$body"
            grep -Fq '"version":"0.3.0"' <<<"$body"
            grep -Fq '"protocolVersion":2' <<<"$body"
            grep -Fq '"roomPoolSize":64' <<<"$body"
            grep -Fq '"snapshotHzCap":20' <<<"$body"
            grep -Fq '"wildlifePerRoom":24' <<<"$body"
            grep -Fq '"persistence":"configured"' <<<"$body"
          done

      - name: Verify branded premium shell and Vietnamese TTS
        run: |
          set -euo pipefail
          base=https://abyss-eater.qs3d.site
          skin_api="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 20 "$base/api/skins")"
          ranks="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 20 "$base/api/leaderboard?season=all-time&limit=5")"
          html="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 20 "$base/")"
          app="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 20 "$base/app.js")"
          tts="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 20 "$base/client-tts.mjs")"
          progression="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 20 "$base/client-progression.mjs")"
          skins="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 20 "$base/game/skins.js")"
          sw="$(curl --fail --show-error --silent --retry 5 --retry-all-errors --max-time 20 "$base/sw.js")"
          expected_cache="$(grep -Eo 'abyss-eater-shell-v[0-9]+' public/sw.js | head -n 1)"
          if [ -z "$expected_cache" ]; then
            echo "::error::Could not derive expected service-worker cache marker from public/sw.js."
            exit 1
          fi
          grep -Fq '"ok":true' <<<"$skin_api"
          grep -Fq '"ok":true' <<<"$ranks"
          grep -Fq 'ABYSS' <<<"$html"
          grep -Fq 'Deep Sea' <<<"$html"
          grep -Fq 'id="leaderboard"' <<<"$html"
          grep -Fq 'id="hud-prey"' <<<"$html"
          grep -Fq 'id="hud-threats"' <<<"$html"
          grep -Fq 'id="touch-joystick"' <<<"$html"
          grep -Fq 'id="tts-enabled-setting"' <<<"$html"
          grep -Fq '/bootstrap.js' <<<"$html"
          grep -Fq "createTtsController" <<<"$app"
          grep -Fq "vi_VN-vais1000-medium" <<<"$tts"
          grep -Fq "@mintplex-labs/piper-tts-web@1.0.5" <<<"$tts"
          grep -Fq "createProgressionClient" <<<"$progression"
          grep -Fq "skinVisual" <<<"$skins"
          grep -Fq "$expected_cache" <<<"$sw"
