name: Production smoke

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: abyss-eater-production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current verified main revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify production convergence and realtime gameplay
        env:
          ABYSS_SMOKE_ATTEMPTS: '30'
          ABYSS_SMOKE_RETRY_MS: '5000'
        run: node scripts/production-smoke.mjs
