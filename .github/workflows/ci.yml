name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: npm test

      - name: Build Worker
        run: npm run build

      - name: Syntax check production Worker
        run: node --check dist/worker.mjs

      - name: Scale qualification
        run: npm run profile:scale

      - name: Record exact-build release evidence
        run: node scripts/release-evidence.mjs

      - name: Probe deployed main read-only
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm run probe:live

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abyss-eater-qualification
          path: |
            artifacts/carrier6-scale-profile.json
            artifacts/release-evidence.json
            artifacts/live-probe.json
          if-no-files-found: ignore
